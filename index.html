<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Scoreboard</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 360px;
      background: transparent !important;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
      overflow: hidden;
    }

    .wrap {
      width: 1200px;
      height: 360px;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 220px 1fr;
      gap: 18px;
      align-items: center;
    }

    .side {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .center {
      height: 230px;
      border-radius: 28px;
      background: rgba(10, 12, 18, 0.92);
      border: 2px solid rgba(255,255,255,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }

    .center .small {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.65);
    }

    .center .main {
      margin-top: 6px;
      font-size: 54px;
      font-weight: 900;
      letter-spacing: -3px;
    }

    .center .sub {
      margin-top: 8px;
      font-size: 18px;
      font-weight: 800;
      color: rgba(255,255,255,0.65);
    }

    .teamCard {
      height: 145px;
      display: grid;
      grid-template-columns: 92px 1fr;
      border-radius: 24px;
      overflow: hidden;
      background: rgba(17, 19, 26, 0.96);
      border: 3px solid var(--team-color);
      color: white;
      box-shadow: 0 10px 22px rgba(0,0,0,0.42);
    }

    .rankBox {
      background: var(--team-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }

    .medal {
      font-size: 34px;
      line-height: 1;
    }

    .rank {
      margin-top: 5px;
      font-size: 25px;
      line-height: 1;
    }

    .info {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .team {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -1px;
      white-space: nowrap;
    }

    .scoreLine {
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 5px;
    }

    .score {
      font-size: 60px;
      font-weight: 900;
      line-height: 0.86;
      letter-spacing: -3px;
    }

    .point {
      font-size: 23px;
      font-weight: 900;
      opacity: 0.75;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="side" id="left"></div>

    <div class="center">
      <div class="small">LIVE SCORE</div>
      <div class="main">운동회</div>
      <div class="sub">TEAM RANKING BOARD</div>
    </div>

    <div class="side" id="right"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxYSNLor6DXPKQFwKzBoszkXqHQWdp1FwaBwH3K1U9c1sn22Uqolb11t93BLOTrk6Gcow/exec";

    const TEAM_COLORS = {
      "머독": { color: "#E53935", text: "#ffffff" },
      "수탉": { color: "#F2F2F2", text: "#111111" },
      "우정잉": { color: "#2979FF", text: "#ffffff" },
      "끠끼": { color: "#FFD633", text: "#111111" },
      "끼끼": { color: "#FFD633", text: "#111111" }
    };

    function normalizeTeamName(name) {
      const teamName = String(name || "").trim();
      if (teamName.includes("끼끼") || teamName.includes("끠끼")) return "끠끼 팀";
      return teamName;
    }

    function getTeamStyle(teamName) {
      const key = Object.keys(TEAM_COLORS).find(name => teamName.includes(name));
      return TEAM_COLORS[key] || { color: "#ffffff", text: "#111111" };
    }

    function getMedal(rank) {
      if (rank === "1") return "🥇";
      if (rank === "2") return "🥈";
      if (rank === "3") return "🥉";
      if (rank === "4") return "☠️";
      return "";
    }

    function makeCard(item) {
      const teamName = normalizeTeamName(item.team);
      const style = getTeamStyle(teamName);
      const rank = String(item.rank || "");

      const card = document.createElement("div");
      card.className = "teamCard";
      card.style.setProperty("--team-color", style.color);
      card.style.setProperty("--text-color", style.text);

      card.innerHTML = `
        <div class="rankBox">
          <div class="medal">${getMedal(rank)}</div>
          <div class="rank">${rank}위</div>
        </div>

        <div class="info">
          <div class="team">${teamName}</div>
          <div class="scoreLine">
            <div class="score">${item.score}</div>
            <div class="point">점</div>
          </div>
        </div>
      `;

      return card;
    }

    async function loadScores() {
      try {
        const res = await fetch(API_URL + "?t=" + Date.now());
        const rows = await res.json();

        const left = document.getElementById("left");
        const right = document.getElementById("right");

        left.innerHTML = "";
        right.innerHTML = "";

        rows.forEach((item, index) => {
          if (index < 2) {
            left.appendChild(makeCard(item));
          } else {
            right.appendChild(makeCard(item));
          }
        });
      } catch (error) {
        console.error("점수 데이터를 불러오지 못했습니다:", error);
      }
    }

    loadScores();
    setInterval(loadScores, 1000);
  </script>
</body>
</html>
