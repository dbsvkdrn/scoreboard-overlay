<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Scoreboard</title>
  <style>
    body {
      margin: 0;
      background: transparent;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .scoreboard {
      width: 1200px;
      height: 260px;
      display: flex;
      gap: 18px;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      flex: 1;
      border-radius: 24px;
      background: linear-gradient(180deg, #1b1b24, #09090d);
      border: 4px solid var(--team-color);
      box-shadow: 0 0 22px var(--team-color);
      color: white;
      text-align: center;
      overflow: hidden;
    }

    .team {
      padding: 18px 8px;
      font-size: 32px;
      font-weight: 900;
      background: var(--team-color);
      color: #111;
    }

    .score {
      margin-top: 22px;
      font-size: 72px;
      font-weight: 900;
      line-height: 1;
    }

    .score span {
      font-size: 32px;
      margin-left: 4px;
    }

    .rank {
      margin-top: 18px;
      font-size: 34px;
      font-weight: 900;
      opacity: 0.95;
    }
  </style>
</head>

<body>
  <div class="scoreboard" id="scoreboard"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxYSNLor6DXPKQFwKzBoszkXqHQWdp1FwaBwH3K1U9c1sn22Uqolb11t93BLOTrk6Gcow/exec";

    function getMedal(rank) {
      if (rank === "1") return "🥇";
      if (rank === "2") return "🥈";
      if (rank === "3") return "🥉";
      if (rank === "4") return "☠️";
      return "";
    }

    async function loadScores() {
      try {
        const res = await fetch(API_URL + "?t=" + Date.now());
        const rows = await res.json();

        const board = document.getElementById("scoreboard");
        board.innerHTML = "";

        rows.forEach(item => {
          const card = document.createElement("div");
          card.className = "card";
          card.style.setProperty("--team-color", item.color || "#ffffff");

          card.innerHTML = `
            <div class="team">${item.team}</div>
            <div class="score">${item.score}<span>점</span></div>
            <div class="rank">${getMedal(String(item.rank))} ${item.rank}위</div>
          `;

          board.appendChild(card);
        });
      } catch (error) {
        console.error("점수 데이터를 불러오지 못했습니다:", error);
      }
    }

    loadScores();
    setInterval(loadScores, 1000);
  </script>
</body>
</html>
