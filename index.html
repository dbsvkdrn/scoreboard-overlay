<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Scoreboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 300px;
      background: transparent !important;
      overflow: hidden;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
    }

    .wrap {
      width: 1200px;
      height: 300px;
      padding: 18px;
      display: flex;
      gap: 14px;
      align-items: flex-end;
    }

    .teamCard {
      flex: 1;
      position: relative;
      height: var(--card-height);
      min-height: 170px;
      border-radius: 22px 22px 10px 10px;
      overflow: hidden;
      background: rgba(14,16,22,0.96);
      border: 3px solid var(--team-color);
      box-shadow: 0 10px 22px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .topGlow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 85px;
      background: linear-gradient(
        180deg,
        var(--team-color-glow),
        rgba(255,255,255,0)
      );
      opacity: 0.35;
      pointer-events: none;
    }

    .rankBox {
      position: absolute;
      top: 12px;
      right: 12px;
      min-width: 82px;
      height: 42px;
      border-radius: 999px;
      background: rgba(0,0,0,0.45);
      border: 2px solid rgba(255,255,255,0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: white;
      font-size: 20px;
      font-weight: 900;
      z-index: 2;
      backdrop-filter: blur(6px);
    }

    .teamName {
      position: relative;
      padding-top: 24px;
      text-align: center;
      color: white;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1px;
      z-index: 1;
    }

    .scoreWrap {
      position: relative;
      padding-bottom: 20px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 5px;
      z-index: 1;
    }

    .score {
      font-size: 78px;
      font-weight: 900;
      line-height: 0.85;
      letter-spacing: -4px;
      color: white;
      text-shadow: 0 0 16px rgba(255,255,255,0.12);
    }

    .point {
      font-size: 26px;
      font-weight: 900;
      color: rgba(255,255,255,0.7);
      transform: translateY(-4px);
    }

    .baseBar {
      width: 100%;
      height: 10px;
      background: var(--team-color);
    }
  </style>
</head>

<body>
  <div class="wrap" id="scoreboard"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxYSNLor6DXPKQFwKzBoszkXqHQWdp1FwaBwH3K1U9c1sn22Uqolb11t93BLOTrk6Gcow/exec";

    const TEAM_COLORS = {
      "머독": {
        color: "#E53935",
        glow: "rgba(229,57,53,0.95)"
      },
      "수탉": {
        color: "#F2F2F2",
        glow: "rgba(255,255,255,0.9)"
      },
      "우정잉": {
        color: "#2979FF",
        glow: "rgba(41,121,255,0.95)"
      },
      "끠끼": {
        color: "#FFD633",
        glow: "rgba(255,214,51,0.95)"
      },
      "끼끼": {
        color: "#FFD633",
        glow: "rgba(255,214,51,0.95)"
      }
    };

    function normalizeTeamName(name) {
      const teamName = String(name || "").trim();

      if (
        teamName.includes("끼끼") ||
        teamName.includes("끠끼")
      ) {
        return "끠끼 팀";
      }

      return teamName;
    }

    function getTeamStyle(teamName) {
      const key = Object.keys(TEAM_COLORS)
        .find(name => teamName.includes(name));

      return TEAM_COLORS[key] || {
        color: "#ffffff",
        glow: "rgba(255,255,255,0.9)"
      };
    }

    function getMedal(rank) {
      if (rank === "1") return "🥇";
      if (rank === "2") return "🥈";
      if (rank === "3") return "🥉";
      if (rank === "4") return "☠️";
      return "";
    }

    function getHeightByRank(rank) {
      if (rank === "1") return "260px";
      if (rank === "2") return "235px";
      if (rank === "3") return "210px";
      return "185px";
    }

    async function loadScores() {
      try {
        const res = await fetch(API_URL + "?t=" + Date.now());
        const rows = await res.json();

        const board = document.getElementById("scoreboard");
        board.innerHTML = "";

        rows.forEach(item => {
          const teamName = normalizeTeamName(item.team);
          const style = getTeamStyle(teamName);
          const rank = String(item.rank || "");

          const card = document.createElement("div");
          card.className = "teamCard";

          card.style.setProperty(
            "--team-color",
            style.color
          );

          card.style.setProperty(
            "--team-color-glow",
            style.glow
          );

          card.style.setProperty(
            "--card-height",
            getHeightByRank(rank)
          );

          card.innerHTML = `
            <div class="topGlow"></div>

            <div class="rankBox">
              ${getMedal(rank)}
              ${rank}위
            </div>

            <div class="teamName">
              ${teamName}
            </div>

            <div class="scoreWrap">
              <div class="score">${item.score}</div>
              <div class="point">점</div>
            </div>

            <div class="baseBar"></div>
          `;

          board.appendChild(card);
        });

      } catch (error) {
        console.error(error);
      }
    }

    loadScores();
    setInterval(loadScores, 1000);
  </script>
</body>
</html>
