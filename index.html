<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Scoreboard</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 1200px;
      background: transparent !important;
      overflow: hidden;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .scoreboard {
      width: 1200px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rows {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      height: 112px;
    }

    .teamBox {
      display: grid;
      grid-template-columns: 14px 1fr;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(15, 17, 23, 0.94);
      border: 2px solid rgba(255,255,255,0.18);
      box-shadow: 0 8px 18px rgba(0,0,0,0.36);
    }

    .colorBar { background: var(--team-color); }

    .info {
      padding: 10px 12px;
      display: grid;
      grid-template-rows: 34px 1fr;
    }

    .topLine {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .team {
      color: white;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -1px;
      white-space: nowrap;
    }

    .rank {
      min-width: 86px;
      height: 34px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: var(--team-color);
      color: var(--text-color);
      font-size: 21px;
      font-weight: 900;
      white-space: nowrap;
    }

    .scoreLine {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      margin-top: 2px;
    }

    .score {
      color: white;
      font-size: 56px;
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -3px;
    }

    .point {
      color: rgba(255,255,255,0.72);
      font-size: 20px;
      font-weight: 900;
      transform: translateY(-3px);
    }

    .detailToggle {
      height: 40px;
      border-radius: 14px;
      background: rgba(15,17,23,0.94);
      border: 2px solid rgba(255,255,255,0.16);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 900;
      font-size: 18px;
      user-select: none;
    }

    .detailPanel {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.35s ease, opacity 0.25s ease;
      border-radius: 18px;
      background: rgba(15,17,23,0.94);
      border: 2px solid rgba(255,255,255,0.16);
    }

    .detailPanel.open {
      max-height: 760px;
      opacity: 1;
    }

    .gameTabs {
      display: flex;
      gap: 10px;
      padding: 14px;
    }

    .gameTab {
      flex: 1;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.06);
      color: white;
      cursor: pointer;
      font-weight: 900;
      font-size: 17px;
    }

    .gameTab.active {
      background: #2979FF;
      box-shadow: 0 0 12px rgba(41,121,255,0.45);
    }

    .rounds {
      padding: 0 14px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .roundRow {
      display: grid;
      grid-template-columns: 66px repeat(4, 1fr);
      gap: 10px;
      align-items: center;
      min-height: 46px;
      border-radius: 12px;
      background: rgba(255,255,255,0.045);
      padding: 0 12px;
      color: white;
      font-size: 16px;
      font-weight: 800;
    }

    .roundTitle {
      font-size: 19px;
      font-weight: 900;
      color: rgba(255,255,255,0.95);
    }

    .placeBox {
      height: 34px;
      padding: 0 10px;
      border-radius: 999px;
      display: grid;
      grid-template-columns: 44px 1fr;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.08);
      white-space: nowrap;
    }

    .placeLabel {
      height: 24px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 900;
      background: rgba(255,255,255,0.14);
    }

    .placeTeam {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 16px;
      font-weight: 900;
    }

    .teamDot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--dot-color);
    }
/* =========================
   등장 애니메이션만 유지
========================= */

.teamBox {
  animation: cardFade 0.45s ease;

  transition:
    transform 0.22s ease,
    box-shadow 0.22s ease,
    border-color 0.22s ease;
}

.teamBox:hover {
  transform: translateY(-3px);

  box-shadow:
    0 14px 28px rgba(0,0,0,0.42);
}

/* =========================
   GAME DETAIL 버튼
========================= */

.detailToggle {

  transition:
    background 0.22s ease,
    transform 0.18s ease,
    box-shadow 0.22s ease;
}

.detailToggle:hover {

  transform: translateY(-2px);

  background:
    rgba(28,32,42,0.98);

  box-shadow:
    0 0 18px rgba(255,255,255,0.08);
}

/* =========================
   게임 탭
========================= */

.gameTab {

  transition:
    transform 0.18s ease,
    background 0.22s ease,
    box-shadow 0.22s ease;
}

.gameTab:hover {

  transform: translateY(-2px);

  background:
    rgba(255,255,255,0.12);
}

.gameTab.active {

  background: #2979FF;

  box-shadow:
    0 0 14px rgba(41,121,255,0.45);
}

/* =========================
   라운드 줄
========================= */

.roundRow {

  animation:
    roundAppear 0.34s ease;

  transition:
    background 0.2s ease,
    transform 0.18s ease;
}

.roundRow:hover {

  background:
    rgba(255,255,255,0.08);

  transform:
    translateX(4px);
}

/* =========================
   라운드 팀 박스
========================= */

.placeBox {

  transition:
    transform 0.18s ease,
    background 0.18s ease,
    border-color 0.18s ease;
}

.placeBox:hover {

  transform:
    translateY(-2px);

  background:
    rgba(255,255,255,0.11);

  border-color:
    rgba(255,255,255,0.18);
}

/* =========================
   PANEL 펼침
========================= */

.detailPanel {

  transform-origin: top center;

  transition:
    max-height 0.42s ease,
    opacity 0.3s ease,
    transform 0.28s ease;
}

.detailPanel.open {

  transform:
    translateY(0px) scaleY(1);
}

.detailPanel:not(.open) {

  transform:
    translateY(-4px) scaleY(0.98);
}

/* =========================
   KEYFRAMES
========================= */

@keyframes cardFade {

  from {

    opacity: 0;

    transform:
      translateY(12px);
  }

  to {

    opacity: 1;

    transform:
      translateY(0);
  }
}

@keyframes roundAppear {

  from {

    opacity: 0;

    transform:
      translateY(6px);
  }

  to {

    opacity: 1;

    transform:
      translateY(0px);
  }
}
  </style>
</head>

<body>
  <div class="scoreboard">
    <div class="rows" id="scoreboard"></div>

    <div class="detailToggle" id="toggleButton">
      GAME DETAIL ▼
    </div>

    <div class="detailPanel" id="detailPanel">
      <div class="gameTabs" id="gameTabs"></div>
      <div class="rounds" id="rounds"></div>
    </div>
  </div>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbxYSNLor6DXPKQFwKzBoszkXqHQWdp1FwaBwH3K1U9c1sn22Uqolb11t93BLOTrk6Gcow/exec";

    let GAME_DATA = {};
    let CURRENT_GAME = "1";

    const TEAM_COLORS = {
      "머독": { color: "#E53935", text: "#ffffff" },
      "수탉": { color: "#F2F2F2", text: "#111111" },
      "우정잉": { color: "#2979FF", text: "#ffffff" },
      "끠끼": { color: "#FFD633", text: "#111111" },
      "끼끼": { color: "#FFD633", text: "#111111" }
    };

    function normalizeTeamName(name) {
      const teamName = String(name || "").trim();
      if (teamName.includes("끼끼") || teamName.includes("끠끼")) return "끠끼 팀";
      return teamName;
    }

    function getTeamStyle(teamName) {
      const key = Object.keys(TEAM_COLORS).find(name => teamName.includes(name));
      return TEAM_COLORS[key] || { color: "#ffffff", text: "#111111" };
    }

    function getMedal(rank) {
      if (rank === "1") return "🥇";
      if (rank === "2") return "🥈";
      if (rank === "3") return "🥉";
      if (rank === "4") return "☠️";
      return "";
    }

    function getTeamByRank(round, targetRank) {
      const teams = [
        { name: "머독", value: round.murdoc },
        { name: "수탉", value: round.sutak },
        { name: "우정잉", value: round.ujung },
        { name: "끠끼", value: round.kkikki }
      ];

      const found = teams.find(team => String(team.value || "").trim() === String(targetRank));
      return found ? found.name : "-";
    }

    function makePlaceBox(rankNumber, teamName) {
      if (teamName === "-") {
        return `
          <div class="placeBox">
            <div class="placeLabel">${rankNumber}위</div>
            <div class="placeTeam">-</div>
          </div>
        `;
      }

      const style = getTeamStyle(teamName);

      return `
        <div class="placeBox">
          <div class="placeLabel">${rankNumber}위</div>
          <div class="placeTeam">
            <span class="teamDot" style="--dot-color:${style.color};"></span>
            ${teamName}
          </div>
        </div>
      `;
    }

    function getRoundNumber(roundName) {
      const match = String(roundName || "").match(/\d+/);
      return match ? Number(match[0]) : 999;
    }

    function hasRoundData(round) {
      return (
        String(round.murdoc || "").trim() !== "" ||
        String(round.sutak || "").trim() !== "" ||
        String(round.ujung || "").trim() !== "" ||
        String(round.kkikki || "").trim() !== ""
      );
    }

    function renderGame(gameId) {
      CURRENT_GAME = gameId;

      const rounds = document.getElementById("rounds");
      rounds.innerHTML = "";

      document.querySelectorAll(".gameTab").forEach(tab => {
        tab.classList.remove("active");
      });

      document.querySelector(`[data-game="${gameId}"]`)?.classList.add("active");

      const game = GAME_DATA[gameId];
      if (!game) return;

      const validRounds = game.rounds
        .filter(round => hasRoundData(round))
        .sort((a, b) => getRoundNumber(a.round) - getRoundNumber(b.round));

      validRounds.forEach(round => {
        const first = getTeamByRank(round, 1);
        const second = getTeamByRank(round, 2);
        const third = getTeamByRank(round, 3);
        const fourth = getTeamByRank(round, 4);

        const row = document.createElement("div");
        row.className = "roundRow";

        row.innerHTML = `
          <div class="roundTitle">${round.round}</div>
          ${makePlaceBox(1, first)}
          ${makePlaceBox(2, second)}
          ${makePlaceBox(3, third)}
          ${makePlaceBox(4, fourth)}
        `;

        rounds.appendChild(row);
      });
    }

    async function loadScores() {
      try {
        const res = await fetch(API_URL + "?t=" + Date.now());
        const data = await res.json();

        GAME_DATA = data.games || {};

        const rows = (data.scores || []).sort((a, b) => {
  return Number(a.rank) - Number(b.rank);
});
        const board = document.getElementById("scoreboard");
        board.innerHTML = "";

        rows.forEach(item => {
          const teamName = normalizeTeamName(item.team);
          const style = getTeamStyle(teamName);
          const rank = String(item.rank || "");

          const box = document.createElement("div");
          box.className = "teamBox";
          box.style.setProperty("--team-color", style.color);
          box.style.setProperty("--text-color", style.text);

          box.innerHTML = `
            <div class="colorBar"></div>
            <div class="info">
              <div class="topLine">
                <div class="team">${teamName}</div>
                <div class="rank">${getMedal(rank)} ${rank}위</div>
              </div>
              <div class="scoreLine">
                <div class="score">${item.score}</div>
                <div class="point">점</div>
              </div>
            </div>
          `;

          board.appendChild(box);
        });

        const tabs = document.getElementById("gameTabs");
        tabs.innerHTML = "";

        Object.keys(GAME_DATA).forEach(gameId => {
          const game = GAME_DATA[gameId];

          const tab = document.createElement("div");
          tab.className = "gameTab";
          tab.dataset.game = gameId;
          tab.innerText = game.gameName;
          tab.onclick = () => renderGame(gameId);

          tabs.appendChild(tab);
        });

        renderGame(CURRENT_GAME);
      } catch (error) {
        console.error(error);
      }
    }

    const toggleButton = document.getElementById("toggleButton");
    const detailPanel = document.getElementById("detailPanel");

    let opened = false;

    toggleButton.onclick = () => {
      opened = !opened;

      if (opened) {
        detailPanel.classList.add("open");
        toggleButton.innerText = "GAME DETAIL ▲";
      } else {
        detailPanel.classList.remove("open");
        toggleButton.innerText = "GAME DETAIL ▼";
      }
    };

    loadScores();
    setInterval(loadScores, 1000);
  </script>
</body>
</html>
