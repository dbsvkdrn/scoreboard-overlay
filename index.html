<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Scoreboard</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 1200px;
      background: transparent !important;
      overflow: hidden;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
    }

    .scoreboard {
      width: 1200px;
      padding: 18px;
    }

    .rows {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      height: 112px;
    }

    .teamBox {
      display: grid;
      grid-template-columns: 14px 1fr;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(15, 17, 23, 0.94);
      border: 2px solid rgba(255,255,255,0.18);
      box-shadow: 0 8px 18px rgba(0,0,0,0.36);
      will-change: transform;
    }

    .colorBar {
      background: var(--team-color);
    }

    .info {
      padding: 10px 12px;
      display: grid;
      grid-template-rows: 34px 1fr;
    }

    .topLine {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .team {
      color: white;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -1px;
      white-space: nowrap;
    }

    .rank {
      min-width: 86px;
      height: 34px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: var(--team-color);
      color: var(--text-color);
      font-size: 21px;
      font-weight: 900;
      white-space: nowrap;
    }

    .rank.bump {
      animation: rankBump 0.45s ease;
    }

    .scoreLine {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      margin-top: 2px;
    }

    .score {
      color: white;
      font-size: 56px;
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -3px;
    }

    .score.bump {
      animation: scoreBump 0.45s ease;
    }

    .point {
      color: rgba(255,255,255,0.72);
      font-size: 20px;
      font-weight: 900;
      transform: translateY(-3px);
    }

    @keyframes scoreBump {
      0% { transform: scale(1); }
      45% { transform: scale(1.16); }
      100% { transform: scale(1); }
    }

    @keyframes rankBump {
      0% { transform: scale(1); }
      45% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
  </style>
</head>

<body>
  <div class="scoreboard">
    <div class="rows" id="scoreboard"></div>
  </div>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbxYSNLor6DXPKQFwKzBoszkXqHQWdp1FwaBwH3K1U9c1sn22Uqolb11t93BLOTrk6Gcow/exec";

    let PREV_STATE = {};

    const TEAM_COLORS = {
      "머독": { color: "#E53935", text: "#ffffff" },
      "수탉": { color: "#F2F2F2", text: "#111111" },
      "우정잉": { color: "#2979FF", text: "#ffffff" },
      "끠끼": { color: "#FFD633", text: "#111111" },
      "끼끼": { color: "#FFD633", text: "#111111" }
    };

    function normalizeTeamName(name) {
      const teamName = String(name || "").trim();
      if (teamName.includes("끼끼") || teamName.includes("끠끼")) return "끠끼 팀";
      return teamName;
    }

    function getTeamStyle(teamName) {
      const key = Object.keys(TEAM_COLORS).find(name => teamName.includes(name));
      return TEAM_COLORS[key] || { color: "#ffffff", text: "#111111" };
    }

    function getMedal(rank) {
      if (rank === "1") return "🥇";
      if (rank === "2") return "🥈";
      if (rank === "3") return "🥉";
      if (rank === "4") return "☠️";
      return "";
    }

    function renderScoreboard(rows) {
      const board = document.getElementById("scoreboard");

      const oldPositions = {};
      board.querySelectorAll(".teamBox").forEach(box => {
        oldPositions[box.dataset.team] = box.getBoundingClientRect();
      });

      board.innerHTML = "";

      rows.forEach(item => {
        const teamName = normalizeTeamName(item.team);
        const style = getTeamStyle(teamName);
        const rank = String(item.rank || "");
        const score = String(item.score || "0");

        const prev = PREV_STATE[teamName];
        const scoreChanged = prev && String(prev.score) !== score;
        const rankChanged = prev && String(prev.rank) !== rank;

        const box = document.createElement("div");
        box.className = "teamBox";
        box.dataset.team = teamName;

        box.style.setProperty("--team-color", style.color);
        box.style.setProperty("--text-color", style.text);

        box.innerHTML = `
          <div class="colorBar"></div>

          <div class="info">
            <div class="topLine">
              <div class="team">${teamName}</div>
              <div class="rank ${rankChanged ? "bump" : ""}">
                ${getMedal(rank)} ${rank}위
              </div>
            </div>

            <div class="scoreLine">
              <div class="score ${scoreChanged ? "bump" : ""}">
                ${score}
              </div>
              <div class="point">점</div>
            </div>
          </div>
        `;

        board.appendChild(box);
      });

      requestAnimationFrame(() => {
        board.querySelectorAll(".teamBox").forEach(box => {
          const oldRect = oldPositions[box.dataset.team];
          const newRect = box.getBoundingClientRect();

          if (!oldRect) return;

          const dx = oldRect.left - newRect.left;
          const dy = oldRect.top - newRect.top;

          if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;

          box.style.transition = "none";
          box.style.transform = `translate(${dx}px, ${dy}px)`;

          requestAnimationFrame(() => {
            box.style.transition = "transform 0.55s cubic-bezier(0.22, 1, 0.36, 1)";
            box.style.transform = "translate(0, 0)";
          });
        });
      });

      const nextState = {};
      rows.forEach(item => {
        const teamName = normalizeTeamName(item.team);
        nextState[teamName] = {
          score: String(item.score || "0"),
          rank: String(item.rank || "")
        };
      });

      PREV_STATE = nextState;
    }

    async function loadScores() {
      try {
        const res = await fetch(API_URL + "?t=" + Date.now());
        const data = await res.json();

        const rows = (data.scores || data || []).sort((a, b) => {
          return Number(a.rank) - Number(b.rank);
        });

        renderScoreboard(rows);
      } catch (error) {
        console.error("점수 데이터를 불러오지 못했습니다:", error);
      }
    }

    loadScores();
    setInterval(loadScores, 1000);
  </script>
</body>
</html>
