<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Scoreboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 280px;
      background: transparent !important;
      overflow: hidden;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .board {
      width: 1160px;
      height: 240px;
      border-radius: 30px;
      background:
        linear-gradient(
          180deg,
          rgba(28,32,44,0.96),
          rgba(10,12,18,0.98)
        );

      border: 2px solid rgba(255,255,255,0.08);

      backdrop-filter: blur(10px);

      display: grid;
      grid-template-columns: repeat(4, 1fr);
      overflow: hidden;

      box-shadow:
        0 18px 40px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .team {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      border-right: 1px solid rgba(255,255,255,0.08);
    }

    .team:last-child {
      border-right: none;
    }

    .topLine {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background: var(--team-color);
      box-shadow: 0 0 18px var(--team-color);
    }

    .medal {
      font-size: 34px;
      line-height: 1;
      margin-bottom: 10px;
    }

    .rank {
      position: absolute;
      top: 18px;
      right: 18px;

      width: 58px;
      height: 58px;

      border-radius: 50%;

      background: rgba(255,255,255,0.06);

      border: 2px solid rgba(255,255,255,0.12);

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      font-size: 20px;
      font-weight: 900;

      backdrop-filter: blur(8px);
    }

    .teamName {
      color: white;
      font-size: 31px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 18px;
      text-align: center;
    }

    .scoreWrap {
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }

    .score {
      color: white;
      font-size: 88px;
      font-weight: 900;
      line-height: 0.82;
      letter-spacing: -5px;
      text-shadow:
        0 0 18px rgba(255,255,255,0.08);
    }

    .point {
      color: rgba(255,255,255,0.65);
      font-size: 24px;
      font-weight: 900;
      transform: translateY(-8px);
    }

    .bottomBar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 14px;
      background: var(--team-color);
      opacity: 0.95;
    }

  </style>
</head>

<body>

  <div class="board" id="scoreboard"></div>

  <script>

    const API_URL = "https://script.google.com/macros/s/AKfycbxYSNLor6DXPKQFwKzBoszkXqHQWdp1FwaBwH3K1U9c1sn22Uqolb11t93BLOTrk6Gcow/exec";

    const TEAM_COLORS = {
      "머독": "#E53935",
      "수탉": "#F2F2F2",
      "우정잉": "#2979FF",
      "끠끼": "#FFD633",
      "끼끼": "#FFD633"
    };

    function normalizeTeamName(name) {
      const teamName = String(name || "").trim();

      if (
        teamName.includes("끼끼") ||
        teamName.includes("끠끼")
      ) {
        return "끠끼 팀";
      }

      return teamName;
    }

    function getTeamColor(teamName) {

      const key = Object.keys(TEAM_COLORS)
        .find(name => teamName.includes(name));

      return TEAM_COLORS[key] || "#ffffff";
    }

    function getMedal(rank) {

      if (rank === "1") return "🥇";
      if (rank === "2") return "🥈";
      if (rank === "3") return "🥉";
      if (rank === "4") return "☠️";

      return "";
    }

    async function loadScores() {

      try {

        const res = await fetch(API_URL + "?t=" + Date.now());

        const rows = await res.json();

        const board = document.getElementById("scoreboard");

        board.innerHTML = "";

        rows.forEach(item => {

          const rank = String(item.rank || "");

          const teamName = normalizeTeamName(item.team);

          const color = getTeamColor(teamName);

          const team = document.createElement("div");

          team.className = "team";

          team.style.setProperty(
            "--team-color",
            color
          );

          team.innerHTML = `
            <div class="topLine"></div>

            <div class="rank">
              ${rank}위
            </div>

            <div class="medal">
              ${getMedal(rank)}
            </div>

            <div class="teamName">
              ${teamName}
            </div>

            <div class="scoreWrap">
              <div class="score">
                ${item.score}
              </div>

              <div class="point">
                점
              </div>
            </div>

            <div class="bottomBar"></div>
          `;

          board.appendChild(team);

        });

      } catch (error) {

        console.error(error);

      }

    }

    loadScores();

    setInterval(loadScores, 1000);

  </script>

</body>
</html>
