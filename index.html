<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Scoreboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 260px;
      background: transparent !important;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
      overflow: hidden;
    }

    body {
      background-color: rgba(0, 0, 0, 0) !important;
    }

    .scoreboard {
      width: 1200px;
      height: 260px;
      display: flex;
      gap: 16px;
      padding: 16px;
    }

    .card {
      flex: 1;
      position: relative;
      height: 228px;
      border-radius: 20px;
      background: rgba(18, 20, 27, 0.96);
      border: 4px solid var(--team-color);
      color: #ffffff;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.42);
    }

    .team {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--team-color);
      color: var(--text-color);
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .content {
      height: 170px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .score {
      font-size: 76px;
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -3px;
    }

    .score span {
      font-size: 30px;
      margin-left: 4px;
      letter-spacing: -1px;
      opacity: 0.9;
    }

    .rank {
      min-width: 150px;
      height: 46px;
      padding: 0 18px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: rgba(255,255,255,0.13);
      border: 2px solid rgba(255,255,255,0.28);
      font-size: 28px;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
    }

    .rank-number {
      transform: translateY(-1px);
    }
  </style>
</head>

<body>
  <div class="scoreboard" id="scoreboard"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxYSNLor6DXPKQFwKzBoszkXqHQWdp1FwaBwH3K1U9c1sn22Uqolb11t93BLOTrk6Gcow/exec";

    const TEAM_COLORS = {
      "머독": { color: "#E53935", text: "#ffffff" },
      "수탉": { color: "#F2F2F2", text: "#111111" },
      "우정잉": { color: "#2979FF", text: "#ffffff" },
      "끠끼": { color: "#FFD633", text: "#111111" },
      "끼끼": { color: "#FFD633", text: "#111111" }
    };

    function normalizeTeamName(name) {
      const teamName = String(name || "").trim();

      if (teamName.includes("끼끼") || teamName.includes("끠끼")) {
        return "끠끼";
      }

      return teamName;
    }

    function getTeamStyle(teamName) {
      const key = Object.keys(TEAM_COLORS).find(name => teamName.includes(name));

      return TEAM_COLORS[key] || {
        color: "#ffffff",
        text: "#111111"
      };
    }

    function getMedal(rank) {
      if (rank === "1") return "🥇";
      if (rank === "2") return "🥈";
      if (rank === "3") return "🥉";
      if (rank === "4") return "☠️";
      return "";
    }

    async function loadScores() {
      try {
        const res = await fetch(API_URL + "?t=" + Date.now());
        const rows = await res.json();

        const board = document.getElementById("scoreboard");
        board.innerHTML = "";

        rows.forEach(item => {
          const teamName = normalizeTeamName(item.team);
          const style = getTeamStyle(teamName);
          const rank = String(item.rank || "");

          const card = document.createElement("div");
          card.className = "card";
          card.style.setProperty("--team-color", style.color);
          card.style.setProperty("--text-color", style.text);

          card.innerHTML = `
            <div class="team">${teamName}</div>

            <div class="content">
              <div class="score">${item.score}<span>점</span></div>

              <div class="rank">
                <span>${getMedal(rank)}</span>
                <span class="rank-number">${rank}위</span>
              </div>
            </div>
          `;

          board.appendChild(card);
        });
      } catch (error) {
        console.error("점수 데이터를 불러오지 못했습니다:", error);
      }
    }

    loadScores();
    setInterval(loadScores, 1000);
  </script>
</body>
</html>
