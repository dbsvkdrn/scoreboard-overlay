<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Scoreboard</title>
  <style>
    body {
      margin: 0;
      background: transparent;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }

    .scoreboard {
      width: 1200px;
      height: 260px;
      display: flex;
      gap: 18px;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      flex: 1;
      border-radius: 24px;
      background: linear-gradient(180deg, #1b1b24, #09090d);
      border: 4px solid var(--team-color);
      box-shadow: 0 0 22px var(--team-color);
      color: white;
      text-align: center;
      overflow: hidden;
    }

    .team {
      padding: 18px 8px;
      font-size: 32px;
      font-weight: 900;
      background: var(--team-color);
      color: #111;
    }

    .score {
      margin-top: 22px;
      font-size: 72px;
      font-weight: 900;
      line-height: 1;
    }

    .score span {
      font-size: 32px;
      margin-left: 4px;
    }

    .rank {
      margin-top: 18px;
      font-size: 34px;
      font-weight: 900;
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="scoreboard" id="scoreboard"></div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSQWFIY5L9KupJVT1L2Zsabdq6TbFDqwNbxChB0KXB_RMnpalAHPSi5s52ksh52ujXB__o35U1-4w8A/pub?gid=501636782&single=true&output=csv";

    async function loadScores() {
      const res = await fetch(CSV_URL + "&cache=" + Date.now());
      const text = await res.text();

      const rows = text.trim().split("\n").slice(1).map(row => {
        const cols = row.split(",");
        return {
          team: cols[0],
          score: cols[1],
          rank: cols[2],
          color: cols[3] || "#ffffff"
        };
      });

      const board = document.getElementById("scoreboard");
      board.innerHTML = "";

      rows.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.style.setProperty("--team-color", item.color);

        card.innerHTML = `
          <div class="team">${item.team}</div>
          <div class="score">${item.score}<span>점</span></div>
          <div class="rank">${getMedal(item.rank)} ${item.rank}위</div>
        `;

        board.appendChild(card);
      });
    }

    function getMedal(rank) {
      if (rank === "1") return "🥇";
      if (rank === "2") return "🥈";
      if (rank === "3") return "🥉";
      if (rank === "4") return "☠️";
      return "";
    }

    loadScores();
    setInterval(loadScores, 3000);
  </script>
</body>
</html>
