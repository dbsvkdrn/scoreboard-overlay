<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Scoreboard</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 150px;
      background: transparent !important;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
      overflow: hidden;
    }

    .board {
      width: 1200px;
      height: 150px;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .team {
      display: grid;
      grid-template-columns: 72px 1fr;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(12, 14, 20, 0.94);
      border: 3px solid var(--team-color);
      box-shadow: 0 8px 20px rgba(0,0,0,0.38);
      color: white;
    }

    .rank {
      background: var(--team-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }

    .medal {
      font-size: 30px;
      line-height: 1;
    }

    .rankText {
      margin-top: 4px;
      font-size: 20px;
      line-height: 1;
    }

    .info {
      padding: 12px 14px;
      display: grid;
      grid-template-rows: 32px 1fr;
    }

    .name {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1px;
      white-space: nowrap;
    }

    .scoreLine {
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 4px;
    }

    .score {
      font-size: 58px;
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -3px;
    }

    .point {
      font-size: 21px;
      font-weight: 900;
      opacity: 0.75;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="board" id="scoreboard"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxYSNLor6DXPKQFwKzBoszkXqHQWdp1FwaBwH3K1U9c1sn22Uqolb11t93BLOTrk6Gcow/exec";

    const TEAM_COLORS = {
      "머독": { color: "#E53935", text: "#ffffff" },
      "수탉": { color: "#F2F2F2", text: "#111111" },
      "우정잉": { color: "#2979FF", text: "#ffffff" },
      "끠끼": { color: "#FFD633", text: "#111111" },
      "끼끼": { color: "#FFD633", text: "#111111" }
    };

    function normalizeTeamName(name) {
      const teamName = String(name || "").trim();
      if (teamName.includes("끼끼") || teamName.includes("끠끼")) return "끠끼 팀";
      return teamName;
    }

    function getTeamStyle(teamName) {
      const key = Object.keys(TEAM_COLORS).find(name => teamName.includes(name));
      return TEAM_COLORS[key] || { color: "#ffffff", text: "#111111" };
    }

    function getMedal(rank) {
      if (rank === "1") return "🥇";
      if (rank === "2") return "🥈";
      if (rank === "3") return "🥉";
      if (rank === "4") return "☠️";
      return "";
    }

    async function loadScores() {
      try {
        const res = await fetch(API_URL + "?t=" + Date.now());
        const rows = await res.json();

        const board = document.getElementById("scoreboard");
        board.innerHTML = "";

        rows.forEach(item => {
          const teamName = normalizeTeamName(item.team);
          const style = getTeamStyle(teamName);
          const rank = String(item.rank || "");

          const card = document.createElement("div");
          card.className = "team";
          card.style.setProperty("--team-color", style.color);
          card.style.setProperty("--text-color", style.text);

          card.innerHTML = `
            <div class="rank">
              <div class="medal">${getMedal(rank)}</div>
              <div class="rankText">${rank}위</div>
            </div>

            <div class="info">
              <div class="name">${teamName}</div>
              <div class="scoreLine">
                <div class="score">${item.score}</div>
                <div class="point">점</div>
              </div>
            </div>
          `;

          board.appendChild(card);
        });
      } catch (error) {
        console.error("점수 데이터를 불러오지 못했습니다:", error);
      }
    }

    loadScores();
    setInterval(loadScores, 1000);
  </script>
</body>
</html>
