<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Scoreboard</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 230px;
      background: transparent !important;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
      overflow: hidden;
    }

    .scoreboard {
      width: 1200px;
      height: 230px;
      display: flex;
      gap: 14px;
      padding: 14px;
    }

    .card {
      flex: 1;
      height: 202px;
      border-radius: 18px;
      background: rgba(16, 18, 24, 0.96);
      border: 3px solid var(--team-color);
      overflow: hidden;
      color: white;
      box-shadow: 0 8px 18px rgba(0,0,0,0.38);
    }

    .top {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--team-color);
      color: var(--text-color);
      font-size: 29px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .middle {
      height: 94px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .score {
      font-size: 70px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -3px;
    }

    .point {
      font-size: 28px;
      font-weight: 900;
      opacity: 0.85;
      transform: translateY(12px);
    }

    .bottom {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      background: rgba(255,255,255,0.06);
      font-size: 30px;
      font-weight: 900;
      white-space: nowrap;
    }

    .medal {
      font-size: 30px;
      line-height: 1;
    }

    .rank {
      font-size: 30px;
      line-height: 1;
      transform: translateY(-1px);
    }
  </style>
</head>

<body>
  <div class="scoreboard" id="scoreboard"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxYSNLor6DXPKQFwKzBoszkXqHQWdp1FwaBwH3K1U9c1sn22Uqolb11t93BLOTrk6Gcow/exec";

    const TEAM_COLORS = {
      "머독": { color: "#E53935", text: "#ffffff" },
      "수탉": { color: "#F2F2F2", text: "#111111" },
      "우정잉": { color: "#2979FF", text: "#ffffff" },
      "끠끼": { color: "#FFD633", text: "#111111" },
      "끼끼": { color: "#FFD633", text: "#111111" }
    };

    function normalizeTeamName(name) {
      const teamName = String(name || "").trim();

      if (teamName.includes("끼끼") || teamName.includes("끠끼")) {
        return "끠끼 팀";
      }

      return teamName;
    }

    function getTeamStyle(teamName) {
      const key = Object.keys(TEAM_COLORS).find(name => teamName.includes(name));
      return TEAM_COLORS[key] || { color: "#ffffff", text: "#111111" };
    }

    function getMedal(rank) {
      if (rank === "1") return "🥇";
      if (rank === "2") return "🥈";
      if (rank === "3") return "🥉";
      if (rank === "4") return "☠️";
      return "";
    }

    async function loadScores() {
      try {
        const res = await fetch(API_URL + "?t=" + Date.now());
        const rows = await res.json();

        const board = document.getElementById("scoreboard");
        board.innerHTML = "";

        rows.forEach(item => {
          const teamName = normalizeTeamName(item.team);
          const style = getTeamStyle(teamName);
          const rank = String(item.rank || "");

          const card = document.createElement("div");
          card.className = "card";
          card.style.setProperty("--team-color", style.color);
          card.style.setProperty("--text-color", style.text);

          card.innerHTML = `
            <div class="top">${teamName}</div>

            <div class="middle">
              <div class="score">${item.score}</div>
              <div class="point">점</div>
            </div>

            <div class="bottom">
              <span class="medal">${getMedal(rank)}</span>
              <span class="rank">${rank}위</span>
            </div>
          `;

          board.appendChild(card);
        });
      } catch (error) {
        console.error("점수 데이터를 불러오지 못했습니다:", error);
      }
    }

    loadScores();
    setInterval(loadScores, 1000);
  </script>
</body>
</html>
